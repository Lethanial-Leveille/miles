[project]
name = "miles-headless"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==0.92.0",
    "bcrypt==4.2.0",
    "cryptography>=42",
    "dateparser==1.4.3",
    "elevenlabs==2.44.0",
    "fastapi==0.136.1",
    "google-api-python-client==2.200.0",
    "google-auth==2.58.0",
    "h2>=4.2.0",
    "httpx==0.28.1",
    "numpy==2.4.4",
    "passlib==1.7.4",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "uvicorn==0.46.0",
    "websockets>=14",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
